name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write          # needed only for publishing releases on v* tags
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: MacKernelSDK
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK
      - name: Build kext
        run: make -C kext SDK=$GITHUB_WORKSPACE/MacKernelSDK
      - name: Build HAL plug-in + probe
        run: make -C hal
      - name: Check bundles
        run: |
          file kext/build/TGLDmic.kext/Contents/MacOS/TGLDmic hal/build/TGLDmic.driver/Contents/MacOS/TGLDmic hal/build/tgldmic-probe
          plutil -lint kext/build/TGLDmic.kext/Contents/Info.plist hal/build/TGLDmic.driver/Contents/Info.plist
          nm -gU hal/build/TGLDmic.driver/Contents/MacOS/TGLDmic | grep TGLDmic_Create
          nm kext/build/TGLDmic.kext/Contents/MacOS/TGLDmic | grep -c TGLDmicUserClient

      - name: Version
        id: ver
        run: echo "v=$(plutil -extract CFBundleShortVersionString raw kext/TGLDmic/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Kext zip
        run: |
          D=dist/TGLDmic-${{ steps.ver.outputs.v }}-kext
          mkdir -p $D
          cp -R kext/build/TGLDmic.kext hal/build/tgldmic-probe $D/
          cp tools/list-audio-devices.py tools/snapshot-to-wav.py hal/uninstall-hal.sh $D/
          cp docs/KEXT-README.md $D/README.md
          cp docs/INSTALL.md $D/INSTALL.md
          cp LICENSE $D/LICENSE
          cp firmware/LICENCE.Intel $D/LICENCE.Intel   # embedded SOF firmware licence
          (cd dist && ditto -c -k --keepParent TGLDmic-${{ steps.ver.outputs.v }}-kext TGLDmic-${{ steps.ver.outputs.v }}-kext.zip)

      - name: Driver installer package
        run: |
          V=${{ steps.ver.outputs.v }}
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/HAL"
          cp -R hal/build/TGLDmic.driver "$ROOT/Library/Audio/Plug-Ins/HAL/"
          # keep the bundle at its install path (no relocation to another copy with the same bundle ID)
          pkgbuild --analyze --root "$ROOT" component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          plutil -replace 0.BundleOverwriteAction -string upgrade component.plist
          # Normalize installer scripts: LF line endings, a #!/bin/bash first line, executable.
          # (CRLF or a missing +x makes Installer fail with only "The installation failed".)
          mkdir -p pkgscripts
          for s in preinstall postinstall; do
            tr -d '\r' < pkg/scripts/$s | sed '/^#!/d' > body.tmp
            { echo '#!/bin/bash'; cat body.tmp; } > pkgscripts/$s
            chmod 755 pkgscripts/$s
            head -1 pkgscripts/$s | od -c | head -1
            bash -n pkgscripts/$s
          done
          mkdir -p pkgparts
          pkgbuild --root "$ROOT" --component-plist component.plist --scripts pkgscripts \
                   --identifier com.labrouss.TGLDmic.driver.pkg --version "$V" --install-location / \
                   pkgparts/TGLDmic-driver-component.pkg
          pkgutil --payload-files pkgparts/TGLDmic-driver-component.pkg
          # verify the scripts inside the component package
          pkgutil --expand pkgparts/TGLDmic-driver-component.pkg pkgcheck
          ls -l pkgcheck/Scripts 2>/dev/null || (cd pkgcheck && mkdir s && cd s && gzip -dc ../Scripts | cpio -i 2>/dev/null; ls -l)
          rm -rf pkgcheck
          # product archive: logo background, title, welcome/conclusion pages
          sed "s/@VERSION@/$V/" pkg/distribution.xml > pkgparts/distribution.xml
          productbuild --distribution pkgparts/distribution.xml --resources pkg/resources \
                       --package-path pkgparts --version "$V" "dist/TGLDmic-$V.pkg"
          pkgutil --check-signature "dist/TGLDmic-$V.pkg" || true
          pkgutil --expand "dist/TGLDmic-$V.pkg" prodcheck && ls -R prodcheck | head -30 && rm -rf prodcheck

      - uses: actions/upload-artifact@v4
        with:
          name: TGLDmic-${{ steps.ver.outputs.v }}-kext
          path: dist/TGLDmic-${{ steps.ver.outputs.v }}-kext.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TGLDmic-${{ steps.ver.outputs.v }}-pkg
          path: dist/TGLDmic-${{ steps.ver.outputs.v }}.pkg

      - name: GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TGLDmic-${{ steps.ver.outputs.v }}-kext.zip
            dist/TGLDmic-${{ steps.ver.outputs.v }}.pkg
