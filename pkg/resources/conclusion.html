<p>Open <b>System Settings → Sound → Input</b> and select <b>Internal Microphone (TGLDmic)</b>.</p>
<p>The input level meter should follow your voice. If the device is missing, check that
<code>kextstat | grep TGLDmic</code> lists the kext and that <code>-tgldmic</code> is in boot-args.</p>
</body></html>
